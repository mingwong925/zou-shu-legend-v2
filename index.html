<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>走數傳奇</title>
</head>
<body>
  <div id="app">
    <div id="hud" class="idle">
      <div id="hudMarquee" aria-label="走數傳奇">
        <div class="hudMarqueeTrack" aria-hidden="true">
          <span>走數傳奇</span>
          <span>走數傳奇</span>
        </div>
      </div>
      <span id="hudLeft">SCORE 0</span>
      <span id="hudMid">STAGE 1</span>
      <span id="hudRight">♥♥♥</span>
    </div>
    <div id="gameWrap">
      <div id="game">
        <!-- Mode select (SINGLE vs MULTI) -->
        <div id="modeScreen" class="screen hide">
          <div class="panel">
            <div class="modeTitle">走數傳奇</div>
            <button class="btn primary" id="btnSingle"> SINGLE PLAYER </button>
            <button class="btn" id="btnMulti"> MULTI PLAYER </button>
          </div>
        </div>

        <!-- Lobby before multiplayer starts -->
        <div id="lobbyScreen" class="screen hide">
          <div class="panel lobbyPanel">
            <div class="modeTitle">MULTI PLAYER</div>
            <div id="lobbyCreateWrap">
              <button class="btn" id="btnCreate"> CREATE ROOM </button>
              <div class="roomCodeLabel">ROOM CODE</div>
              <div id="roomCode" class="roomCode">—</div>
              <button class="btn primary hide" id="btnStartMatch"> START GAME </button>
              <div class="hint">2-6人可開始</div>
            </div>
            <div id="lobbyJoinWrap">
              <input class="joinInput" id="joinCodeInput" type="tel" maxlength="6" inputmode="numeric" placeholder="輸入6位數字" />
              <button class="btn" id="btnJoin"> JOIN ROOM </button>
            </div>
            <div class="hint" id="lobbyMsg">等待玩家加入...</div>
            <div class="playersList" id="playersList"></div>
            <button class="btn" id="btnBackToMenu"> BACK </button>
          </div>
        </div>

        <div id="multiScreen" class="screen hide">
          <div class="panel">
            <div class="modeTitle">MULTI PLAYER</div>
            <div class="roomCodeLabel">ROOM <span id="multiRoomCode">—</span></div>
            <div class="matchStatus" id="matchStatus">MATCH STARTING...</div>
            <div class="playersList" id="matchPlayersList"></div>
            <div class="hint">多人遊戲準備中</div>
          </div>
        </div>

        <div id="startScreen">
          <div id="startCover" aria-hidden="true"></div>
          <button id="startButton" type="button" aria-label="Game start">
            <img src="/game-start.png" alt="GAME START" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
            <span>GAME START</span>
          </button>
        </div>
        <div id="overlay">READY!</div>
      </div>
    </div>
    <div id="mobileControls" aria-label="Mobile direction controls">
      <button type="button" data-dir="left" aria-label="左"></button>
      <button type="button" data-dir="up" aria-label="上"></button>
      <button type="button" data-dir="down" aria-label="下"></button>
      <button type="button" data-dir="right" aria-label="右"></button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
 </body>
</html>
